name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Check public contracts
        run: npm run typecheck -w @emotion-studio/contracts

      - name: Test public contracts
        run: npm run test -w @emotion-studio/contracts

      - name: Build public contracts
        run: npm run build -w @emotion-studio/contracts

      - name: Check frontend
        run: npm run typecheck -w @emotion-studio/web

      - name: Test frontend
        run: npm run test -w @emotion-studio/web

      - name: Build frontend
        run: npm run build -w @emotion-studio/web

      - name: Check database package
        run: npm run typecheck -w @emotion-studio/database

      - name: Test database package
        run: npm run test -w @emotion-studio/database

      - name: Build database package
        run: npm run build -w @emotion-studio/database

      - name: Check backend
        run: npm run typecheck -w @emotion-studio/api

      - name: Test backend
        run: npm run test -w @emotion-studio/api

      - name: Build backend
        run: npm run build -w @emotion-studio/api

      - name: Check worker placeholder
        run: npm run typecheck -w @emotion-studio/worker

      - name: Test worker placeholder
        run: npm run test -w @emotion-studio/worker

      - name: Build worker placeholder
        run: npm run build -w @emotion-studio/worker

      - name: Verify workspace integration
        run: npm run check

  docker-smoke:
    name: Clean Compose smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start clean development stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check API and Web
        run: |
          curl --fail --show-error http://127.0.0.1:8787/api/v1/health
          curl --fail --show-error http://127.0.0.1:5173

      - name: Show service logs
        if: always()
        run: docker compose logs --no-color

      - name: Remove development stack
        if: always()
        run: docker compose down --volumes --remove-orphans
