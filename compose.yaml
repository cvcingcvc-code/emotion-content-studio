name: emotion-content-studio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emotion_studio
      POSTGRES_USER: emotion_studio
      POSTGRES_PASSWORD: local-prototype-only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotion_studio -d emotion_studio"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8787
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://emotion_studio:local-prototype-only@db:5432/emotion_studio
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/v1/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      VITE_API_PROXY_TARGET: http://api:8787
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
